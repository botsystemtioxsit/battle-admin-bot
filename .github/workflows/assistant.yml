name: AI-ассистент админ-панели

# Запускается вручную, по одному нажатию "Отправить" в вкладке "Ассистент"
# панели (src/admin.html) — админ-панель дёргает workflow_dispatch через
# GitHub API (нужен fine-grained PAT с правом "Actions: Read and write" на
# этот репозиторий, вписывается один раз в настройки ассистента в самой
# панели). requestId указывает, какую запись в assistantRequests читать —
# см. .github/scripts/run-assistant.js и lib/assistantCore.js.
on:
  workflow_dispatch:
    inputs:
      requestId:
        description: 'ID запроса в Firebase (assistantRequests/<id>)'
        required: true
        type: string

jobs:
  run-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Выполнить запрос ассистента
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REQUEST_ID: ${{ inputs.requestId }}
        run: node .github/scripts/run-assistant.js
