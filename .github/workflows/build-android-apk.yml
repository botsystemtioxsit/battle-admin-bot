name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses and ensure required packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Постоянный ключ подписи берётся из секрета репозитория
      # ANDROID_KEYSTORE_BASE64 (файл ключа в base64). Без него каждая сборка
      # подписывалась бы новым случайным отладочным ключом: Android не даёт
      # поставить такой APK поверх предыдущего, а Google Play Защита каждый раз
      # видит «нового, незнакомого разработчика» и блокирует установку.
      # Пароль и алиас не секретны (секретен сам файл ключа).
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/battle-signing.p12"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/battle-signing.p12"
              echo "ANDROID_KEYSTORE_PASSWORD=battle-android"
              echo "ANDROID_KEY_ALIAS=battle"
              echo "ANDROID_KEY_PASSWORD=battle-android"
              echo "SIGNING=stable"
            } >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug" >> "$GITHUB_ENV"
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан: APK подписан одноразовым отладочным ключом (см. android/README.md, «Подпись APK»)."
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Show signing certificate
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-256)"
          echo "Подпись: $SIGNING"

      # Файл в релизе называется по приложению, а не app-debug.apk: у игры и
      # панели иначе одно и то же имя, и в «Загрузках» телефона их не отличить
      # (легко поставить старый файл вместо нового).
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/battle-admin.apk

      # Сборка с ветки в релиз не попадает, но файл можно скачать из запуска
      # (Actions → запуск → Artifacts) и проверить до слияния в main.
      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/battle-admin.apk
          retention-days: 3

      - name: Read version
        id: ver
        run: |
          echo "name=$(grep -o 'versionName "[^"]*"' android/app/build.gradle | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -o 'versionCode [0-9]*' android/app/build.gradle | grep -o '[0-9]*')" >> "$GITHUB_OUTPUT"

      # Машиночитаемая версия для автообновления внутри самого приложения
      # (MainActivity.checkForUpdate скачивает именно этот файл и сравнивает
      # versionCode со своим собственным) — раньше номер версии был только
      # в тексте релиза, откуда его пришлось бы парсить регулярками.
      # Публикуется тем же фиксированным тегом android-latest, что и сам
      # APK, поэтому у него всегда один и тот же стабильный URL.
      - name: Write version.json
        run: |
          cat > android/version.json <<EOF
          {"versionCode": ${{ steps.ver.outputs.code }}, "versionName": "${{ steps.ver.outputs.name }}"}
          EOF

      - name: Publish GitHub Release with APK attached
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: БАТТЛ Админ (Android) — последняя сборка
          files: |
            android/battle-admin.apk
            android/version.json
          body: |
            Версия ${{ steps.ver.outputs.name }}, сборка ${{ github.run_number }}, из коммита ${{ github.sha }}.
            Этот релиз всегда переиспользуется под фиксированным тегом `android-latest` — ссылка на него не меняется между сборками.

      # Старый файл app-debug.apk в релизе больше не обновляется — убираем его,
      # чтобы по нему не скачали устаревшую сборку.
      - name: Remove the old app-debug.apk asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset android-latest app-debug.apk --yes --repo "$GITHUB_REPOSITORY" || true
