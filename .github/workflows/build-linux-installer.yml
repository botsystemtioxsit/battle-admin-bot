name: Build Linux installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-linux-installer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop app dependencies
        working-directory: desktop
        run: npm ci

      - name: Build AppImage + .deb + .tar.gz (native Linux, no wine needed)
        working-directory: desktop
        run: npm run build:linux

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with installer attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-linux-latest
          name: БАТТЛ Админ (Linux) — последняя сборка
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.tar.gz
          body: |
            Версия ${{ steps.ver.outputs.version }}, сборка ${{ github.run_number }}, из коммита ${{ github.sha }}. Три формата — выбирай, какой заведётся на твоей системе (см. README в desktop/ насчёт ChromeOS/Crostini):
            - **AppImage** — `chmod +x *.AppImage && ./БАТТЛ*.AppImage`. Нужен FUSE (`sudo apt install libfuse2` или `libfuse2t64`, если отсутствует).
            - **.deb** — `sudo dpkg -i *.deb`. На части свежих ChromeOS-образов больше не ставится.
            - **.tar.gz** — самый универсальный вариант, ничего не ставит в систему: `tar -xzf battle-admin-desktop-*.tar.gz && cd battle-admin-desktop-*/ && ./battle-admin-desktop`.
            Этот релиз всегда переиспользуется под фиксированным тегом `desktop-linux-latest` — ссылка на него не меняется между сборками.
