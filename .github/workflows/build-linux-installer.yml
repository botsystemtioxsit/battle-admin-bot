name: Build Linux installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-linux-installer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop app dependencies
        working-directory: desktop
        run: npm ci

      # --publish always делает и сборку, и публикацию сам electron-builder:
      # создаёт/обновляет тот же релиз v<version>, что и Windows-сборка
      # (см. build.publish в package.json — оба таргета публикуются в ОДИН
      # и тот же релиз репозитория, это и нужно electron-updater), заливает
      # AppImage/.deb/.tar.gz и генерирует latest-linux.yml. Автообновление
      # внутри приложения реально работает только для AppImage (это
      # единственный официально поддерживаемый electron-updater формат на
      # Linux) — .deb/.tar.gz как и раньше обновляются вручную, перекачкой
      # по той же ссылке. GH_TOKEN — автоматический токен раннера с правами
      # contents:write (см. permissions выше), отдельно заводить не нужно.
      - name: Build and publish AppImage + .deb + .tar.gz (native Linux, no wine needed)
        working-directory: desktop
        run: npm run build:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
