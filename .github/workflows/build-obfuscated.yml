name: Build obfuscated admin.html

on:
  push:
    branches: [main]
    paths:
      - 'src/admin.html'
  workflow_dispatch: {}

# Guard against an infinite loop: this workflow's own commit step only
# touches public/admin.html, never src/admin.html, so it can never match
# its own path filter above and re-trigger itself.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install terser
        # --no-save / no lockfile write: keeps this step fully isolated from
        # the repo's own root package.json/package-lock.json (used only by
        # the Telegram bot process) — nothing here touches those files.
        run: npm install terser --no-save --no-package-lock

      - name: Build minified+mangled admin.html
        run: node .github/scripts/build-obfuscated.js

      - name: Validate generated admin.html
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('public/admin.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          let hadError = false;
          scripts.forEach((s,i) => { try { new Function(s); } catch(e) { console.log('Script', i, 'error:', e.message); hadError = true; } });
          const noComments = html.replace(/<!--[\s\S]*?-->/g, '');
          const openCount = (noComments.match(/<div/g)||[]).length;
          const closeCount = (noComments.match(/<\/div>/g)||[]).length;
          console.log('div open/close:', openCount, closeCount);
          if (openCount !== closeCount) hadError = true;
          if (hadError) { console.log('VALIDATION FAILED'); process.exit(1); }
          console.log('VALIDATION PASSED');
          "

      - name: Compare div balance against source
        run: |
          node -e "
          const fs = require('fs');
          function divCounts(path) {
            const html = fs.readFileSync(path, 'utf8');
            const noComments = html.replace(/<!--[\s\S]*?-->/g, '');
            return {
              open: (noComments.match(/<div/g)||[]).length,
              close: (noComments.match(/<\/div>/g)||[]).length,
            };
          }
          const src = divCounts('src/admin.html');
          const gen = divCounts('public/admin.html');
          console.log('src/admin.html div open/close:', src.open, src.close);
          console.log('public/admin.html div open/close:', gen.open, gen.close);
          if (src.open !== gen.open || src.close !== gen.close) {
            console.log('MISMATCH between source and generated output');
            process.exit(1);
          }
          console.log('MATCH');
          "

      - name: Commit and push generated admin.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/admin.html
          git diff --cached --quiet || git commit -m "Auto-build: minify+mangle admin.html from src/admin.html [skip ci]"
          git push
