name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-installer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop app dependencies
        working-directory: desktop
        run: npm ci

      # --publish always делает и сборку, и публикацию сам electron-builder:
      # создаёт/обновляет релиз с тегом v<version> (см. build.publish в
      # package.json), заливает туда .exe и генерирует latest.yml — файл,
      # по которому electron-updater внутри приложения понимает, что вышла
      # новая версия. GH_TOKEN — обычный автоматический токен раннера
      # GitHub Actions с правами contents:write (см. permissions выше),
      # отдельно заводить/хранить ничего не нужно.
      - name: Build and publish .exe installer (native Windows, no wine needed)
        working-directory: desktop
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
