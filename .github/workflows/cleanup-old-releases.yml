name: Cleanup old releases (one-off)

# Разовая уборка: удаляет устаревшие релизы 1.0.0 со старыми значками
# (старый APK и старые установщики Windows/Linux). Запускается вручную
# (Actions -> Run workflow) и после использования удаляется из репозитория.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete 1.0.0 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in android-v1.0.0-2 desktop-windows-latest desktop-linux-latest desktop-windows-v1.0.0-1; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" && echo "удалён: $tag"
            else
              echo "такого релиза нет: $tag"
            fi
          done
