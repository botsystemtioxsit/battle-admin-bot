name: Deploy role-gateway Worker

# Выкладка Cloudflare Worker'а role-gateway без терминала: запускается кнопкой
# "Run workflow" на вкладке Actions (или через API). Ключ сервисного аккаунта
# Firebase берётся из уже существующего секрета FIREBASE_SERVICE_ACCOUNT и
# попадает прямо в секреты Worker'а — его не нужно ни копировать, ни
# вставлять руками. Порядок шагов важен: сначала самотест (ключ реально
# пишет в базу в обход правил), и только потом выкладка.
#
# Разовая настройка (один раз, 2 минуты) — секреты репозитория
# Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   — токен Cloudflare по шаблону «Edit Cloudflare
#                            Workers» (dash.cloudflare.com → My Profile →
#                            API Tokens → Create Token)
#   CLOUDFLARE_ACCOUNT_ID  — необязательно; нужен, только если токен видит
#                            несколько аккаунтов Cloudflare
#   FIREBASE_SERVICE_ACCOUNT — уже есть (общий с index.html, см.
#                            firebase-database-deploy.yml)
# Секреты самого Worker'а (BOT_TOKEN, GITHUB_TOKEN, ROLE_GRANT_KEY)
# переживают выкладку и здесь не трогаются.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-role-gateway
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WORKER_URL: https://battle-role-gateway.tioxsit.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Проверить, что нужные секреты заданы
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Нет секрета CLOUDFLARE_API_TOKEN — создайте токен Cloudflare по шаблону «Edit Cloudflare Workers» и добавьте в Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Нет секрета FIREBASE_SERVICE_ACCOUNT."
            missing=1
          fi
          exit $missing

      - name: Самотест — ключ сервисного аккаунта пишет в базу в обход правил
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cloudflare-worker/role-gateway/scripts/selftest-firebase-admin.mjs

      - name: Выложить Worker
        working-directory: cloudflare-worker/role-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4 deploy

      - name: Передать ключ сервисного аккаунта Worker'у (секрет FIREBASE_SERVICE_ACCOUNT)
        working-directory: cloudflare-worker/role-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx --yes wrangler@4 secret put FIREBASE_SERVICE_ACCOUNT

      - name: Проверить, что Worker работает в admin-режиме
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(curl -fsS "$WORKER_URL/health" || true)
            echo "health: $out"
            if echo "$out" | grep -q '"firebaseAdminConfigured":true'; then
              echo "Worker выложен и пишет в базу токеном сервисного аккаунта."
              exit 0
            fi
            sleep 5
          done
          echo "::error::После выкладки /health не показывает firebaseAdminConfigured:true — Worker остался в legacy-режиме."
          exit 1
