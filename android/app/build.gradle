plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tioxsit.battleadmin'
    compileSdk 34

    defaultConfig {
        // Суффикс .icontest — не опечатка и не тест. На телефоне владельца лаунчер держал
        // СТАРЫЙ значок за прежним именем пакета com.tioxsit.battleadmin и не обновлял его
        // ни после переустановки, ни после очистки кэша; тот же APK под новым именем
        // сразу показал новый значок. Возвращать прежнее имя нельзя — значок снова
        // станет старым. Код (namespace и пакет в java/) от этого не зависит.
        applicationId "com.tioxsit.battleadmin.icontest"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "1.1.8"
    }

    signingConfigs {
        // Постоянный ключ подписи. Файл ключа CI достаёт из секрета
        // ANDROID_KEYSTORE_BASE64 (см. README → «Подпись APK»). Без секрета
        // блок пустой, и сборка подписывается одноразовым отладочным ключом,
        // как раньше.
        stable {
            def ksFile = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
