plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tioxsit.battleadmin'
    compileSdk 34

    defaultConfig {
        applicationId "com.tioxsit.battleadmin"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
