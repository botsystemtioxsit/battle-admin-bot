plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tioxsit.battleadmin'
    compileSdk 34

    defaultConfig {
        applicationId "com.tioxsit.battleadmin"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "1.1.7"
    }

    signingConfigs {
        // Постоянный ключ подписи. Файл ключа CI достаёт из секрета
        // ANDROID_KEYSTORE_BASE64 (см. README → «Подпись APK»). Без секрета
        // блок пустой, и сборка подписывается одноразовым отладочным ключом,
        // как раньше.
        stable {
            def ksFile = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
        }
        // Проверочная версия значка. Ставится РЯДОМ с обычным приложением как отдельное
        // (другое имя пакета и название «… (тест значка)»): так видно, показывает ли
        // телефон новый значок, без влияния старой установки, ярлыков и кэша лаунчера.
        // Собирается только в сборках из ветки (см. .github/workflows/build-android-apk.yml).
        iconTest {
            initWith debug
            applicationIdSuffix ".icontest"
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
