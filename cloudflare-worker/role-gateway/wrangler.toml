name = "battle-role-gateway"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Секреты (BOT_TOKEN, GITHUB_TOKEN, FIREBASE_SERVICE_ACCOUNT) сюда НЕ пишутся —
# задаются отдельно (`wrangler secret put` либо workflow "Deploy role-gateway
# Worker" в репозитории index.html), см. README.md рядом.

# Раз в минуту: бот выгоняет новичков чата, не нажавших «Я не бот» вовремя (src/chat-admin.mjs). Без этого выгоняет только тогда,
# когда в чате что-то происходит.
[triggers]
crons = ["* * * * *"]

[vars]
# Отдельная база Firebase для Gateway Plus (проект vpn0dns, регион europe-west1). Это НЕ секрет. Ключ её сервисного аккаунта —
# секрет GATEWAY_FIREBASE_SERVICE_ACCOUNT (задаётся отдельно); пока его нет, Gateway Plus работает с основной базой.
GATEWAY_DB_URL = "https://vpn0dns-default-rtdb.europe-west1.firebasedatabase.app"

# Telegram-id тех, кого Worker считает superadmin: выдача ролей admin/superadmin,
# полная перезапись базы (/restore-database), бэкапы и восстановление кода
# (GITHUB_TOKEN). Это НЕ секрет (id виден всем в базе, а подлинность проверяет
# подпись initData). Роль в базе (users/<id>/role) для этих действий не
# используется: её любой может стереть, а до исправления правил — подделать.
# Несколько id — через запятую. Чтобы добавить второго superadmin, допишите
# его id сюда и выложите Worker заново.
OWNER_IDS = "871656058"

# Mini App ВидеоЧата: бот @TIOXSITvoice_chat_bot, у него главное приложение (BotFather → Configure Mini App) с адресом
# https://botsystemtioxsit.github.io/videochat/. Формат «имя_бота» (главное приложение) или «имя_бота/короткое_имя».
# /call в группах открывает ВидеоЧат прямо внутри Телеграма; если оставить пустым — обычная ссылка на страницу.
VIDEOCHAT_MINIAPP = "TIOXSITvoice_chat_bot"
